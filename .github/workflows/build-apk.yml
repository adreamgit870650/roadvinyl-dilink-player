name: Build APK

env:
  ROADVINYL_UPDATE_VERSION_URL: ${{ vars.ROADVINYL_UPDATE_VERSION_URL }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Test, lint and build release APK
        run: gradle -PyinyanMinSdk=24 testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadVinyl-4.7.0-android7-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Publish downloadable build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.7.0-build
          name: RoadVinyl 4.7.0 cloud build
          prerelease: true
          body: |
            这是自动构建的未签名 APK，仅供后续使用原车机签名进行正式发布。
            正式分发前，请使用与车机现有版本一致的证书完成签名。
          files: app/build/outputs/apk/release/app-release-unsigned.apk
