server {
    listen 80;
    server_name _;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","version":"4.1.0","signed":false}';
    }

    location = /roadvinyl-4.1.0-unsigned.apk {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        return 302 /roadvinyl-4.1.0-unsigned.apk;
    }
}
